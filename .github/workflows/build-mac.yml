name: Build macOS App
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install flask pillow pyautogui psutil opencv-python pyinstaller

      - name: Build .app
        run: |
          pyinstaller --windowed --name "Phone Control" \
            --hidden-import tkinter --hidden-import _tkinter \
            --collect-all cv2 --collect-all PIL \
            phone_control_mac.py

      - name: Zip .app
        run: |
          cd dist
          zip -r "Phone-Control-mac.zip" "Phone Control.app"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Phone-Control-mac
          path: dist/Phone-Control-mac.zip
          retention-days: 7
